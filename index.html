<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的专属天气助手 ❤️</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #ff6b81;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="card">
        <h1>小仙女的专享 App ✨</h1>
        <p>这是为你定制的天气提醒助手，以后每天都有它替我提醒你增减衣物、带伞哦！</p>
        <!-- 这里的名字已经完美匹配你上传的 leo-daily-publish.zip -->
        <a href="leo-daily-publish.zip" class="btn">点击一键下载安装</a>
    </div>

</body>
</html>
